<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<title>Stage — Divine Comedy</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<style>
  :root {
    --bg: #000;
    --hint: rgba(255, 255, 255, 0.55);
    --hint-bg: rgba(0, 0, 0, 0.65);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: #fff;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    cursor: none;
  }
  body.show-cursor { cursor: default; }

  #stage {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    opacity: 0;
    transition: opacity 900ms ease;
    will-change: opacity;
  }
  .slide.active { opacity: 1; }
  .slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    pointer-events: none;
    -webkit-user-drag: none;
  }

  /* Black state is just: no active slide. */

  /* Text overlay slide type (for frase-martello on black) */
  .slide.text-slide {
    padding: 6vh 10vw;
    text-align: center;
  }
  .slide.text-slide .lines {
    font-family: "Iowan Old Style", "Palatino", "Georgia", serif;
    font-size: clamp(2rem, 4.8vw, 4.6rem);
    line-height: 1.35;
    letter-spacing: 0.01em;
    color: #f4f1ea;
    text-shadow: 0 2px 30px rgba(0,0,0,0.6);
  }
  .slide.text-slide .lines > div + div { margin-top: 0.4em; }

  /* HUD: controls hint + index, fades out after 2s idle */
  #hud {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 14px 18px;
    display: none;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    color: var(--hint);
    font-size: 12px;
    letter-spacing: 0.03em;
    background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0));
    transition: opacity 400ms ease;
    z-index: 10;
  }
  body.idle #hud { opacity: 0; }
  #hud .keys code {
    padding: 2px 6px;
    margin-right: 6px;
    background: var(--hint-bg);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 3px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #hud .index { font-variant-numeric: tabular-nums; }

  /* Title card shown on load */
  #titlecard {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: #000;
    z-index: 20;
    transition: opacity 600ms ease;
    padding: 0 10vw;
  }
  #titlecard.hidden { opacity: 0; pointer-events: none; }
  #titlecard .kicker {
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    margin-bottom: 28px;
  }
  #titlecard h1 {
    font-family: "Iowan Old Style", "Palatino", "Georgia", serif;
    font-weight: 400;
    font-size: clamp(2rem, 5vw, 4.5rem);
    margin: 0 0 18px 0;
    letter-spacing: 0.01em;
  }
  #titlecard .tagline {
    font-family: "Iowan Old Style", "Palatino", "Georgia", serif;
    font-style: italic;
    color: rgba(255,255,255,0.72);
    font-size: clamp(1rem, 2vw, 1.4rem);
  }
  /* Error state */
  #err {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: #111;
    color: #e55;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 14px;
    padding: 40px;
    text-align: center;
    line-height: 1.6;
  }
  #err.show { display: flex; }
</style>
</head>
<body class="idle">

<div id="titlecard">
  <div class="kicker" id="tc-kicker">Divine Comedy</div>
  <h1 id="tc-title">Stage</h1>
  <div class="tagline" id="tc-tagline"></div>
</div>

<div id="stage">
  <!-- slides injected here -->
</div>

<div id="hud">
  <div class="keys" id="keys-hint">
    <code>→</code> avanza
    <code>←</code> indietro
    <code>B</code> nero
    <code>F</code> fullscreen
    <code>0-9</code> salta
  </div>
  <div class="index" id="idx">—</div>
</div>

<div id="err"></div>

<script>
(function () {
  'use strict';

  // ---------- Config ----------
  // Resolve which canto to load from ?canto=XX (e.g. ?canto=01).
  // Fallback: 01.
  const params = new URLSearchParams(window.location.search);
  const cantoId = (params.get('canto') || '01').padStart(2, '0');
  const cantiche = params.get('cantica') || 'inferno';

  // A tiny per-canto manifest. Extend as more canti are added.
  // Each entry is a slide: { type: 'image'|'text'|'black', src?, lines?, label? }
  // Order matters: these are the keyboard steps.
  const MANIFESTS = {
    '01': {
      title: 'Inferno — Canto I',
      tagline: 'Senza misura non c\u2019è via',
      basePath: './inferno/canto-01/images/',
      slides: [
        { type: 'image', src: '01_canto_01_16x9.png', label: 'Selva / smarrimento' },
        { type: 'black', label: 'Nero — frase martello' },
        { type: 'text', lines: ['La lonza devia.', 'Il leone domina.', 'La lupa svuota.'], label: 'Tre fiere' },
        { type: 'image', src: '01_canto_02_16x9.png', label: 'Virgilio / il viaggio parte' },
        { type: 'text', lines: ['Senza misura', 'non c’è via.'], label: 'Motto — chiusura' }
      ]
    },
    '02': {
      title: 'Inferno — Canto II',
      tagline: 'Non si scende da soli',
      basePath: './inferno/canto-02/images/',
      slides: [
        { type: 'image', src: '02_canto_01.png', label: 'Notte / colloquio con Virgilio' },
        { type: 'text', lines: ['Io sol uno.'], label: 'Apertura' },
        { type: 'black', label: 'Viltà — nero' },
        { type: 'image', src: '02_canto_01.png', label: 'Beatrice / la discesa dell’aiuto' },
        { type: 'text', lines: ['Amor mi mosse,', 'che mi fa parlare.'], label: 'Amor mi mosse' },
        { type: 'text', lines: ['Maria vede.', 'Lucia si muove.', 'Beatrice scende.'], label: 'Tre donne benedette' },
        { type: 'image', src: '02_canto_01.png', label: 'Chiusura — si riparte' },
        { type: 'text', lines: ['Intrai per lo cammino', 'alto e silvestro.'], label: 'Chiusura' }
      ]
    },
    '03': {
      title: 'Inferno — Canto III',
      tagline: 'Anche non scegliere è una condanna',
      basePath: './inferno/canto-03/images/',
      slides: [
        { type: 'black', label: 'Nero — apertura / la porta' },
        { type: 'image', src: '03_canto_01.png', label: 'Porta / vestibolo' },
        { type: 'text', lines: ['Lasciate ogne speranza,', 'voi ch\u2019intrate.'], label: 'Frase-martello porta' },
        { type: 'black', label: 'Nero — sulla soglia' },
        { type: 'image', src: '03_canto_01.png', label: 'Ignavi / insegna' },

        { type: 'text', lines: ['Mai non', 'fur vivi.'], label: 'Mai non fur vivi' },
        { type: 'image', src: '03_canto_02.png', label: 'Caronte / Acheronte' },
        { type: 'text', lines: ['Vuolsi cos\u00ec col\u00e0', 'dove si puote', 'ci\u00f2 che si vuole.'], label: 'Vuolsi cos\u00ec' },
        { type: 'text', lines: ['La tema', 'si volve in disio.'], label: 'Tema in disio' },
        { type: 'black', label: 'Nero — svenimento' },
        { type: 'text', lines: ['Anche non scegliere', '\u00e8 una condanna.'], label: 'Motto — chiusura' }
      ]
    },
    '04': {
      title: 'Inferno — Canto IV',
      tagline: 'Desiderio senza approdo',
      basePath: './inferno/canto-04/images/',
      slides: [
        { type: 'black', label: 'Nero — apertura / tuono' },
        { type: 'image', src: '04_CANTO_01.png', label: 'Limbo / risveglio' },
        { type: 'text', lines: ['Quella piet\u00e0', 'che tu per tema senti.'], label: 'Piet\u00e0 non paura' },
        { type: 'black', label: 'Nero — sul verso-cardine' },
        { type: 'text', lines: ['Duol', 'sanza mart\u00ecri.'], label: 'Duol sanza mart\u00ecri' },
        { type: 'text', lines: ['Sanza speme', 'vivemo in disio.'], label: 'Sanza speme, in disio' },
        { type: 'image', src: '04_CANTO_01.png', label: 'Poeti / castello' },
        { type: 'text', lines: ['Fui sesto', 'tra cotanto senno.'], label: 'Sesto tra cotanto senno' },
        { type: 'text', lines: ['Il maestro', 'di color che sanno.'], label: 'Aristotele' },
        { type: 'text', lines: ['E vegno in parte', 'ove non \u00e8 che luca.'], label: 'Uscita nel buio' },
        { type: 'black', label: 'Nero — chiusura' },
        { type: 'text', lines: ['Desiderio', 'senza approdo.'], label: 'Motto — chiusura' }
      ]
    },
    '05': {
      title: 'Inferno — Canto V',
      tagline: "L'amore non basta",
      basePath: './inferno/canto-05/images/',
      slides: [
        { type: 'black', label: 'Nero — apertura / loco d’ogne luce muto' },
        { type: 'image', src: '05_CANTO_01.png', label: 'Minosse' },
        { type: 'image', src: '05_CANTO_02.png', label: 'La bufera' },
        { type: 'text', lines: ['La ragion', 'sommettono al talento.'], label: 'Ragion sotto talento' },
        { type: 'black', label: 'Nero — sulle tre Amor' },
        { type: 'text', lines: ['Amor, ch’al cor gentil', 'ratto s’apprende.'], label: 'Amor I' },
        { type: 'text', lines: ['Amor, ch’a nullo amato', 'amar perdona.'], label: 'Amor II' },
        { type: 'text', lines: ['Amor', 'condusse noi ad una morte.'], label: 'Amor III' },
        { type: 'image', src: '05_CANTO_03.png', label: 'Paolo e Francesca / il libro' },
        { type: 'text', lines: ['Galeotto fu il libro', 'e chi lo scrisse.'], label: 'Galeotto' },
        { type: 'text', lines: ['E caddi', 'come corpo morto cade.'], label: 'La caduta' },
        { type: 'black', label: 'Nero — chiusura' },
        { type: 'text', lines: ['L’amore', 'non basta.'], label: 'Motto — chiusura' }
      ]
    },
    '06': {
      title: 'Inferno — Canto VI',
      tagline: 'Si diventa ciò che si è ingoiato',
      basePath: './inferno/canto-06/images/',
      slides: [
        { type: 'black', label: 'Nero — apertura / risveglio nel terzo cerchio' },
        { type: 'image', src: '06_canto_01.png', label: 'Cerbero / terzo cerchio' },
        { type: 'text', lines: ['Pioggia', 'etterna, maladetta.'], label: 'La pioggia maledetta' },
        { type: 'text', lines: ['Cerbero,', 'fiera crudele e diversa.'], label: 'Cerbero' },
        { type: 'text', lines: ['Tre gole', 'per ingoiare.'], label: 'Tre gole' },
        { type: 'text', lines: ['Voi cittadini', 'mi chiamaste Ciacco.'], label: 'Il nome perduto' },
        { type: 'text', lines: ['Mi fiacco.'], label: 'Mi disfaccio' },
        { type: 'black', label: 'Nero — sulla profezia' },
        { type: 'image', src: '06_canto_01.png', label: 'Ciacco / Firenze malata' },
        { type: 'text', lines: ['Giusti son due,', 'e non vi sono intesi.'], label: 'Giusti son due' },
        { type: 'text', lines: ['Superbia, invidia', 'e avarizia.'], label: 'Le tre faville' },
        { type: 'black', label: 'Nero — sintesi a metà canto' },
        { type: 'text', lines: ['Pluto,', 'il gran nemico.'], label: 'Pluto' },
        { type: 'black', label: 'Nero — chiusura' },
        { type: 'text', lines: ['Si diventa', 'ciò che si è ingoiato.'], label: 'Motto — chiusura' }
      ]
    },
    '07': {
      title: 'Inferno — Canto VII',
      tagline: 'Niente si tiene',
      basePath: './inferno/canto-07/images/',
      slides: [
        { type: 'black', label: 'Nero — apertura / Pluto che grida' },
        { type: 'image', src: '07_canto_01.png', label: 'Pluto / quarto cerchio' },
        { type: 'text', lines: ['Pape Satàn,', 'pape Satàn aleppe!'], label: 'Pluto' },
        { type: 'text', lines: ['Taci,', 'maledetto lupo!'], label: 'Virgilio chiude la bocca a Pluto' },
        { type: 'text', lines: ['Perché tieni?', 'Perché burli?'], label: 'Avari e prodighi' },
        { type: 'text', lines: ['E papi', 'e cardinali.'], label: 'Papi e cardinali nel quarto cerchio' },
        { type: 'black', label: 'Nero — discorso sulla Fortuna' },
        { type: 'text', lines: ['Le sue permutazion', 'non hanno triegue.'], label: 'La Fortuna' },
        { type: 'text', lines: ['Ella s’è beata', 'e ciò non ode.'], label: 'Beata e sorda' },
        { type: 'black', label: 'Nero — sintesi a metà canto' },
        { type: 'image', src: '07_canto_01.png', label: 'Stige / accidiosi' },
        { type: 'text', lines: ['Tristi fummo', 'ne l’aere dolce.'], label: 'L’inno degli accidiosi' },
        { type: 'text', lines: ['Or ci attristiam', 'ne la belletta negra.'], label: 'Nella melma nera' },
        { type: 'black', label: 'Nero — chiusura' },
        { type: 'text', lines: ['Niente', 'si tiene.'], label: 'Motto — chiusura' }
      ]
    },
    '08': {
      title: 'Inferno — Canto VIII',
      tagline: 'Da qui il male è scelto',
      basePath: './inferno/canto-08/images/',
      slides: [
        { type: 'black', label: 'Nero — apertura / le due fiamme dalle torri' },
        { type: 'image', src: '08_canto_01.png', label: 'Flegiàs / Argenti' },
        { type: 'text', lines: ['Or se’ giunta,', 'anima fella!'], label: 'Flegiàs' },
        { type: 'text', lines: ['Chi se’ tu', 'che vieni anzi ora?'], label: 'Argenti emerge' },
        { type: 'text', lines: ['Con piangere e con lutto,', 'spirito maladetto,', 'ti rimani.'], label: 'Dante respinge Argenti' },
        { type: 'text', lines: ['Alma sdegnosa,', 'benedetta colei', 'che ’n te s’incinse!'], label: 'Virgilio benedice' },
        { type: 'black', label: 'Nero — sintesi a metà canto' },
        { type: 'image', src: '08_canto_02.png', label: 'Le mura di Dite' },
        { type: 'text', lines: ['Le sue meschite,', 'vermiglie come', 'di foco uscite.'], label: 'La città di Dite' },
        { type: 'text', lines: ['Più di mille', 'da ciel piovuti.'], label: 'I diavoli sulla porta' },
        { type: 'text', lines: ['Chiuser le porte', 'nel petto', 'al mio segnor.'], label: 'La porta sbarrata' },
        { type: 'text', lines: ['Li occhi a la terra', 'e le ciglia avea rase', 'd’ogne baldanza.'], label: 'Virgilio scosso' },
        { type: 'text', lines: ['Tal che per lui', 'ne fia la terra aperta.'], label: 'La promessa' },
        { type: 'black', label: 'Nero — chiusura' },
        { type: 'text', lines: ['Da qui', 'il male', 'è scelto.'], label: 'Motto — chiusura' }
      ]
    },
    '09': {
      title: 'Inferno — Canto IX',
      tagline: 'Si apre da fuori',
      basePath: './inferno/canto-09/images/',
      slides: [
        { type: 'black', label: 'Nero — apertura / Virgilio pallido' },
        { type: 'image', src: '09_canto_01.png', label: 'Furie / Dite / sepolcri' },
        { type: 'text', lines: ['Pur a noi converrà', 'vincer la punga,', 'se non…'], label: 'La frase tronca di Virgilio' },
        { type: 'text', lines: ['Ver è ch’altra fïata', 'qua giù fui.'], label: 'Erichto' },
        { type: 'text', lines: ['Tre Furie infernal', 'di sangue tinte.'], label: 'Le Furie sulla torre' },
        { type: 'text', lines: ['Vegna Medusa:', 'sì ’l farem di smalto.'], label: 'La minaccia di Medusa' },
        { type: 'text', lines: ['Volgiti ’n dietro', 'e tien lo viso chiuso.'], label: 'Gli occhi coperti' },
        { type: 'black', label: 'Nero — appello al lettore' },
        { type: 'text', lines: ['O voi ch’avete', 'li ’ntelletti sani,', 'mirate la dottrina.'], label: 'Appello al lettore' },
        { type: 'black', label: 'Nero — sintesi a metà canto' },
        { type: 'image', src: '09_canto_01.png', label: 'Il messo celeste / i sepolcri' },
        { type: 'text', lines: ['Passava Stige', 'con le piante asciutte.'], label: 'L’angelo arriva' },
        { type: 'text', lines: ['Con una verghetta', 'l’aperse.'], label: 'La porta si apre' },
        { type: 'text', lines: ['Perché recalcitrate', 'a quella voglia?'], label: 'L’angelo ai diavoli' },
        { type: 'text', lines: ['Qui son li eresïarche', 'coi lor seguaci.'], label: 'I sepolcri infuocati' },
        { type: 'black', label: 'Nero — chiusura' },
        { type: 'text', lines: ['Si apre', 'da fuori.'], label: 'Motto — chiusura' }
      ]
    },
    '10': {
      title: 'Inferno — Canto X',
      tagline: 'Si è ancora chi si è stati',
      basePath: './inferno/canto-10/images/',
      slides: [
        { type: 'black', label: 'Nero — apertura / fra le mura e le tombe' },
        { type: 'image', src: '10_canto_01.png', label: 'Farinata / Cavalcante / le tombe' },
        { type: 'text', lines: ['O Tosco', 'che per la città del foco', 'vivo ten vai.'], label: 'La voce di Farinata' },
        { type: 'text', lines: ['Com’ avesse l’inferno', 'a gran dispitto.'], label: 'Farinata si alza' },
        { type: 'text', lines: ['Chi fuor', 'li maggior tui?'], label: 'La domanda di Farinata' },
        { type: 'text', lines: ['Ma i vostri', 'non appreser ben', 'quell’arte.'], label: 'La stoccata di Dante' },
        { type: 'text', lines: ['Mio figlio ov’è?', 'e perché non è teco?'], label: 'Cavalcante chiede di Guido' },
        { type: 'text', lines: ['Non viv’ elli ancora?', 'Non fiere li occhi suoi', 'lo dolce lume?'], label: 'Il "ebbe"' },
        { type: 'black', label: 'Nero — la caduta di Cavalcante' },
        { type: 'image', src: '10_canto_01.png', label: 'Il sepolcro infuocato' },
        { type: 'text', lines: ['Supin ricadde', 'e più non parve fora.'], label: 'Cavalcante crolla' },
        { type: 'black', label: 'Nero — sintesi a metà canto' },
        { type: 'text', lines: ['Non mutò aspetto,', 'né mosse collo,', 'né piegò sua costa.'], label: 'Farinata immutato' },
        { type: 'text', lines: ['Non cinquanta volte', 'fia raccesa', 'la faccia de la donna che qui regge.'], label: 'La profezia dell’esilio' },
        { type: 'text', lines: ['Ciò mi tormenta', 'più che questo letto.'], label: 'Il tormento più grande' },
        { type: 'text', lines: ['Noi veggiam', 'le cose che ne son lontano.'], label: 'La vista degli eretici' },
        { type: 'text', lines: ['Qui con più di mille', 'giaccio.'], label: 'Federico II' },
        { type: 'black', label: 'Nero — chiusura' },
        { type: 'text', lines: ['Si è ancora', 'chi si è stati.'], label: 'Motto — chiusura' }
      ]
    },
    '11': {
      title: 'Inferno — Canto XI',
      tagline: 'Più si scende, più si sceglie',
      basePath: './inferno/canto-11/images/',
      slides: [
        { type: 'black', label: 'Nero — apertura / sosta sull’orlo' },
        { type: 'text', lines: ['Anastasio papa', 'guardo.'], label: 'La tomba di Anastasio' },
        { type: 'text', lines: ['Lo nostro scender', 'conviene esser tardo.'], label: 'La sosta' },
        { type: 'text', lines: ['Figliuol mio,', 'son tre cerchietti', 'di grado in grado.'], label: 'Tre cerchi sotto' },
        { type: 'text', lines: ['O con forza', 'o con frode', 'altrui contrista.'], label: 'Forza o frode' },
        { type: 'text', lines: ['Frode è de l’uom', 'proprio male,', 'più spiace a Dio.'], label: 'La frode è il male proprio dell’uomo' },
        { type: 'text', lines: ['A Dio,', 'a sé,', 'al prossimo.'], label: 'Tre direzioni della violenza' },
        { type: 'text', lines: ['Qualunque trade', 'in etterno è consunto.'], label: 'Il fondo: il tradimento' },
        { type: 'black', label: 'Nero — sintesi a metà canto' },
        { type: 'text', lines: ['Incontenenza', 'men Dio offende', 'e men biasimo accatta.'], label: 'L’incontinenza fuori delle mura' },
        { type: 'text', lines: ['L’arte vostra', 'a Dio quasi è nepote.'], label: 'L’arte come nipote di Dio' },
        { type: 'text', lines: ['Ma seguimi oramai,', 'che ’l gir mi piace.'], label: 'Si riparte' },
        { type: 'black', label: 'Nero — chiusura' },
        { type: 'text', lines: ['Più si scende,', 'più si sceglie.'], label: 'Motto — chiusura' }
      ]
    }
  };

  const manifest = MANIFESTS[cantoId];
  if (!manifest) {
    showError('Nessun manifest per canto "' + cantoId + '". Aggiungi una voce in MANIFESTS dentro stage.html.');
    return;
  }

  // ---------- Title card ----------
  document.getElementById('tc-kicker').textContent = 'Divine Comedy \u00b7 ' + cantiche.toUpperCase();
  document.getElementById('tc-title').textContent = manifest.title;
  document.getElementById('tc-tagline').textContent = manifest.tagline || '';

  // ---------- Build slides ----------
  const stage = document.getElementById('stage');
  const idxEl = document.getElementById('idx');
  const titlecard = document.getElementById('titlecard');
  const slides = manifest.slides;
  const slideEls = [];

  slides.forEach((slide, i) => {
    const el = document.createElement('div');
    el.className = 'slide';
    el.dataset.index = String(i);

    if (slide.type === 'image') {
      const img = document.createElement('img');
      img.src = manifest.basePath + slide.src;
      img.alt = slide.label || '';
      img.onerror = () => {
        img.remove();
        const fallback = document.createElement('div');
        fallback.className = 'lines';
        fallback.style.color = '#7a5';
        fallback.textContent = '[immagine mancante: ' + slide.src + ']';
        el.classList.add('text-slide');
        el.appendChild(fallback);
      };
      el.appendChild(img);
    } else if (slide.type === 'text') {
      el.classList.add('text-slide');
      const wrap = document.createElement('div');
      wrap.className = 'lines';
      (slide.lines || []).forEach(line => {
        const d = document.createElement('div');
        d.textContent = line;
        wrap.appendChild(d);
      });
      el.appendChild(wrap);
    } else {
      // black: nothing inside; the slide stays empty and transparent.
      // We still render a slide element so stepping through respects it.
      el.classList.add('black-slide');
    }

    stage.appendChild(el);
    slideEls.push(el);
  });

  // ---------- State ----------
  let index = -1;         // -1 = title card
  let blackOverride = false;

  function render() {
    const hidden = index < 0;
    titlecard.classList.toggle('hidden', !hidden);
    slideEls.forEach((el, i) => {
      const isActive = !hidden && !blackOverride && i === index;
      el.classList.toggle('active', isActive);
    });
    if (hidden) {
      idxEl.textContent = '—';
    } else {
      const slide = slides[index];
      const type = slide.type.toUpperCase();
      idxEl.textContent =
        (index + 1) + '/' + slides.length +
        '  \u00b7  ' + type +
        (slide.label ? '  \u00b7  ' + slide.label : '') +
        (blackOverride ? '  \u00b7  [BLACK]' : '');
    }
  }

  function next() {
    blackOverride = false;
    if (index < slides.length - 1) index++;
    else index = slides.length - 1;
    render();
  }
  function prev() {
    blackOverride = false;
    if (index > -1) index--;
    render();
  }
  function jump(n) {
    blackOverride = false;
    if (n >= 0 && n < slides.length) { index = n; render(); }
  }
  function toggleBlack() { blackOverride = !blackOverride; render(); }
  function toggleFullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }

  let fullscreenAttempted = false;
  function ensureFullscreen() {
    if (fullscreenAttempted || document.fullscreenElement) return;
    fullscreenAttempted = true;
    document.documentElement.requestFullscreen?.().catch?.(() => {});
  }

  // ---------- Input ----------
  window.addEventListener('keydown', (e) => {
    // Ignore modifier combos so browser shortcuts still work.
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    switch (e.key) {
      case 'ArrowRight':
      case ' ':
      case 'PageDown':
      case 'Enter':
        ensureFullscreen();
        e.preventDefault(); next(); break;
      case 'ArrowLeft':
      case 'PageUp':
      case 'Backspace':
        ensureFullscreen();
        e.preventDefault(); prev(); break;
      case 'Home':
        e.preventDefault(); jump(0); break;
      case 'End':
        e.preventDefault(); jump(slides.length - 1); break;
      case 'b': case 'B':
        ensureFullscreen();
        e.preventDefault(); toggleBlack(); break;
      case 'f': case 'F':
        e.preventDefault(); toggleFullscreen(); break;
      case 'Escape':
        e.preventDefault(); index = -1; blackOverride = false; render(); break;
      default:
        if (/^[0-9]$/.test(e.key)) {
          const n = parseInt(e.key, 10);
          // 1..9 → slide 1..9 (1-indexed), 0 → slide 10
          const target = n === 0 ? 9 : n - 1;
          jump(target);
        }
    }
  });

  // Touch devices should be usable on stage without extra URL params.
  const touchMode =
    params.get('click') === '1' ||
    navigator.maxTouchPoints > 0 ||
    window.matchMedia?.('(pointer: coarse)').matches;

  if (touchMode) {
    document.body.classList.add('touch-stage');

    let lastTouchTs = 0;
    function handleTapNav(clientX) {
      ensureFullscreen();
      const half = window.innerWidth / 2;
      if (clientX < half) prev();
      else next();
    }

    window.addEventListener('touchend', (e) => {
      const touch = e.changedTouches?.[0];
      if (!touch) return;
      lastTouchTs = Date.now();
      e.preventDefault();
      handleTapNav(touch.clientX);
    }, { passive: false });

    window.addEventListener('click', (e) => {
      // Ignore the synthetic click that often follows a touch on iPad/iPhone.
      if (Date.now() - lastTouchTs < 700) return;
      handleTapNav(e.clientX);
    });
  }

  // ---------- Idle cursor / hud ----------
  let idleTimer = null;
  function wake() {
    document.body.classList.remove('idle');
    document.body.classList.add('show-cursor');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      document.body.classList.add('idle');
      document.body.classList.remove('show-cursor');
    }, 2000);
  }
  window.addEventListener('mousemove', wake);
  window.addEventListener('touchstart', wake, { passive: true });
  window.addEventListener('keydown', wake);
  wake();

  // Initial paint
  render();

  // ---------- Utils ----------
  function showError(msg) {
    const e = document.getElementById('err');
    e.textContent = msg;
    e.classList.add('show');
  }
})();
</script>
</body>
</html>
